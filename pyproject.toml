[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimla-backend"
version = "0.1.0"
description = "Backend services for the AIMLA AI-native website"
requires-python = ">=3.10"

dependencies = [
  "sentence-transformers>=3.0.0",
  "scikit-learn>=1.0.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
]

[project.urls]
Repository = "https://github.com/TMU-AI/aimlaWebsite"