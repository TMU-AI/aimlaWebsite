<!DOCTYPE html>
<html>
<head>
  <title>Chatbot Text Streaming Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }

    .container {
      background: white;
      max-width: 750px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    #streamedText {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    button {
      margin-top: 24px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Chatbot Text Streaming Demo</h1>

    <p id="streamedText"></p>

    <button onclick="startStreaming()">Start Streaming</button>
  </div>

  <!-- Typed.js Package -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>

  <script>
    const exampleParagraph =
      "Text streaming makes a chatbot feel faster by displaying the response piece by piece instead of waiting for the full message to finish. This can be used to make static PageContent feel like it is being generated by an AI model.";

    const textObject = {
      fullText: exampleParagraph,
      streamedText: "",
      isStreaming: false,
      complete: false
    };

    let typedInstance = null;

    function startStreaming() {
      document.getElementById("streamedText").textContent = "";

      if (typedInstance) {
        typedInstance.destroy();
      }

      textObject.streamedText = "";
      textObject.isStreaming = true;
      textObject.complete = false;

      typedInstance = new Typed("#streamedText", {
        strings: [textObject.fullText],
        typeSpeed: 0,
        showCursor: true,
        cursorChar: "|",

        onStringTyped: function () {
          textObject.streamedText = textObject.fullText;
          textObject.isStreaming = false;
          textObject.complete = true;

          console.log("Final text object:", textObject);
        },

        preStringTyped: function () {
          console.log("Streaming started:", textObject);
        }
      });
    }
  </script>
</body>
</html>
